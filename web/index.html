<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>会長のスケジュール係</title>
<script>
// 配られた個別リンク（#k=<キー>）でこの端末を本人だと認めさせる。ログイン画面は無い。
// 発注書アプリの web/app/access.js と同じ仕組み。ハッシュは消さない（ホーム画面追加時に URL ごと保存されるため）。
(function () {
  var LS_KEY = 'ssm_key_v1';
  var KEY_RE = /^[A-Za-z0-9_-]{24,}$/;
  function readLS() { try { return localStorage.getItem(LS_KEY) || ''; } catch (e) { return ''; } }
  function writeLS(k) { try { localStorage.setItem(LS_KEY, k); } catch (e) {} }
  function keyFromHash() {
    var h = (location.hash || '').replace(/^#/, '');
    var m = /(?:^|[&;])k=([A-Za-z0-9_-]+)/.exec(h);
    return m && KEY_RE.test(m[1]) ? m[1] : '';
  }
  var fromHash = keyFromHash();
  if (fromHash) writeLS(fromHash);
  var key = readLS();
  window.SSM_KEY = key;
  // 開いたままリンクを貼り直されたときも拾う（再読み込みして最初からやり直す）
  window.addEventListener('hashchange', function () { var k = keyFromHash(); if (k && k !== window.SSM_KEY) { writeLS(k); location.reload(); } });
  // すべての /api/ 呼び出しに X-App-Key と credentials を付ける
  window.ssmFetch = function (url, init) {
    init = init || {};
    var headers = Object.assign({}, init.headers || {});
    if (window.SSM_KEY) headers['X-App-Key'] = window.SSM_KEY;
    return fetch(url, Object.assign({}, init, { headers: headers, credentials: 'same-origin' }));
  };
  window.ssmKeyReady = key
    ? window.ssmFetch('/api/key', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: key }) }).then(function (r) { return r.ok; }).catch(function () { return false; })
    : Promise.resolve(false);
  function denyScreen() {
    var el = document.createElement('div');
    el.setAttribute('style', 'position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 24px;box-sizing:border-box;text-align:center;background:#F7F1E8;color:#3A322B;font-family:"Zen Maru Gothic","Noto Sans JP",system-ui,sans-serif');
    var t = document.createElement('div'); t.setAttribute('style', 'font-size:17px;font-weight:700;line-height:1.7'); t.textContent = 'このリンクからは使えません';
    var p = document.createElement('div'); p.setAttribute('style', 'font-size:13px;line-height:1.9;color:#77695B;max-width:20rem'); p.textContent = '配られたスケジュール係のリンクを開いてください';
    el.appendChild(t); el.appendChild(p);
    (document.body || document.documentElement).appendChild(el);
  }
  // アプリを起動する前に一度だけ身元を確かめる。401 / 503 なら止める（入力欄は置かない）
  window.ssmGate = function () {
    return window.ssmKeyReady
      .then(function () { return window.ssmFetch('/api/me', {}); })
      .then(function (r) {
        if (r.status !== 401 && r.status !== 503) return true;
        var show = function () { denyScreen(); };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
        return false;
      })
      .catch(function () { return true; });
  };
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6E7F4F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="assets/icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root {
    --ground: #F7F1E8; --surface: #FFFFFF; --surface-2: #FBF8F3; --line: #E7DDCF;
    --ink: #3A322B; --ink-2: #77695B; --ink-3: #A8998A;
    --accent: #6E7F4F; --accent-ink: #FFFFFF; --accent-soft: #EEF1E4;
    --warm: #F2C9A8; --warm-deep: #D9925F; --me: #EFE7DB;
    --ok: #4F8A5B; --bad: #B8433E;
    --k-visit: #D9925F; --k-work: #B36B4C; --k-office: #6E7F4F; --k-off: #8C8AAE; --k-other: #9A8C7C;
    --shadow: 0 8px 24px rgba(74, 56, 34, .10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #221D19; --surface: #2D2622; --surface-2: #332B26; --line: #453B34;
      --ink: #F1E9DE; --ink-2: #BDAF9F; --ink-3: #8A7C6E;
      --accent: #9DB077; --accent-ink: #1F241A; --accent-soft: #34392B;
      --warm: #8A5A3A; --warm-deep: #E3A876; --me: #3A322C;
      --shadow: 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 16px; line-height: 1.6; padding-inline: 16px; padding-block: 12px 0; }
  h1, h2, h3 { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; font-weight: 700; margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--warm-deep); outline-offset: 2px; }

  /* ---------- 骨組み。スマホは縦一列＋タブ、PC は写真を左に大きく ---------- */
  .app { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; height: calc(100dvh - 12px); gap: 12px; }
  .topbar { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .topbar .mark { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 18px; }
  .topbar h1 { font-size: 18px; line-height: 1.2; }
  .topbar .sub { font-size: 12px; color: var(--ink-2); }
  .topbar .sync { margin-left: auto; font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; text-align: right; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; flex-shrink: 0; }
  .dot.bad { background: var(--bad); }

  /* 写真。会話中もここは動かない */
  .portrait { position: relative; flex: 0 0 auto; height: 44dvh; min-height: 260px; border-radius: 22px; overflow: hidden; background: var(--warm); box-shadow: var(--shadow); }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 42% 20%; display: block; }
  .portrait .ai-line { position: absolute; left: 12px; right: 12px; bottom: 12px; background: rgba(255,255,255,.92); color: #3A322B; border-radius: 16px; border-bottom-left-radius: 6px; padding: 10px 14px; font-size: 17px; line-height: 1.55; box-shadow: 0 6px 18px rgba(74,56,34,.18); max-height: 42%; overflow: hidden; }
  .portrait .ai-line:empty { display: none; }
  .portrait .live { position: absolute; top: 12px; left: 12px; font-size: 12px; font-weight: 700; color: #fff; background: rgba(58,50,43,.55); border-radius: 999px; padding: 3px 10px; display: none; }
  .portrait .live.on { display: inline-flex; align-items: center; gap: 6px; }
  .portrait .live i { width: 8px; height: 8px; border-radius: 50%; background: #FF6B5B; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .screen { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 12px; padding-bottom: 84px; overflow-y: auto; }
  .screen.active { display: flex; }
  #screen-chat { overflow: visible; }

  .today { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; flex-shrink: 0; }
  .tag { border-radius: 999px; padding: 2px 10px; background: var(--surface); border: 1px solid var(--line); }
  .tag.yes { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 700; }
  .tag.ask { background: var(--warm); border-color: transparent; font-weight: 700; }

  /* 会長の一言（最新だけ）とマイク */
  .me-line { align-self: flex-end; max-width: 92%; background: var(--me); border-radius: 16px; border-top-right-radius: 6px; padding: 8px 14px; font-size: 16px; min-height: 1.6em; }
  .me-line:empty { display: none; }
  .talk { flex-shrink: 0; display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 10px 14px; box-shadow: var(--shadow); }
  .mic { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex-shrink: 0; transition: transform .12s; }
  .mic:active { transform: scale(.96); }
  .mic svg { width: 28px; height: 28px; }
  .mic.on { background: var(--bad); box-shadow: 0 0 0 6px rgba(184, 67, 62, .18); animation: pulse 1.6s ease-in-out infinite; }
  .mic:disabled { opacity: .5; cursor: default; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(184, 67, 62, .06); } }
  @media (prefers-reduced-motion: reduce) { .mic.on { animation: none; } .portrait .live i { animation: none; } }
  .talk .t b { display: block; font-size: 16px; }
  .talk .t span { font-size: 13px; color: var(--ink-2); }
  .sys-line { font-size: 12px; color: var(--ink-3); text-align: center; min-height: 1.4em; }
  .sys-line.err { color: var(--bad); }

  /* ---------- お弁当ボード ---------- */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .section-head h2 { font-size: 18px; }
  .section-head .meta { font-size: 12px; color: var(--ink-2); }
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); }
  .tile .lbl { font-size: 12px; color: var(--ink-2); }
  .tile .val { font-family: "Zen Maru Gothic", sans-serif; font-size: 24px; font-weight: 700; line-height: 1.3; }
  .tile .when { font-size: 12px; color: var(--ink-3); }
  .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .pill.yes { background: var(--accent-soft); color: var(--accent); }
  .pill.no { background: var(--me); color: var(--ink-2); }
  .pill.ask { background: var(--warm); color: var(--ink); }
  .pill.off { background: transparent; color: var(--ink-3); border: 1px dashed var(--line); }
  .week { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .day { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); }
  .day:first-child { border-top: 0; }
  .day.today { background: var(--surface-2); }
  .day .d b { font-family: "Zen Maru Gothic", sans-serif; font-size: 17px; display: block; line-height: 1.1; }
  .day .d span { font-size: 12px; color: var(--ink-2); }
  .day.sun .d b { color: var(--warm-deep); } .day.sat .d b { color: #6C86A8; }
  .day .p { font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .day .p .none { color: var(--ink-3); }
  .kind { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; }
  .kind.訪問 { background: var(--k-visit); } .kind.工事 { background: var(--k-work); } .kind.社内 { background: var(--k-office); } .kind.休み { background: var(--k-off); } .kind.その他 { background: var(--k-other); }
  .foot { font-size: 12px; color: var(--ink-3); text-align: center; }

  /* ---------- タブ（スマホ） ---------- */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--ground) 70%, transparent); }
  .nav-inner { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 6px; }
  .nav button { border: 0; background: transparent; border-radius: 16px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--ink-2); }
  .nav button svg { width: 22px; height: 22px; }
  .nav button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  body[data-tab="bento"] .portrait { display: none; }

  @media (max-width: 480px) { .topbar h1 { font-size: 16px; } .topbar .sync { font-size: 11px; white-space: nowrap; } }
  @media (max-width: 420px) { .summary { grid-template-columns: 1fr; } .day { grid-template-columns: 52px 1fr; } .day .b { grid-column: 2; justify-self: start; } }

  /* ---------- PC: 写真を左に大きく、右に会話とお弁当を並べる ---------- */
  @media (min-width: 900px) {
    body { padding-inline: 24px; padding-block: 16px; }
    .app { max-width: 1240px; height: calc(100dvh - 32px); display: grid; grid-template-columns: minmax(420px, 52%) 1fr; grid-template-rows: auto 1fr; grid-template-areas: "top top" "portrait right"; column-gap: 24px; row-gap: 14px; }
    .topbar { grid-area: top; }
    .portrait { grid-area: portrait; height: auto; min-height: 0; display: block !important; }
    .portrait img { object-position: 45% 30%; }
    .portrait .ai-line { left: 20px; right: 20px; bottom: 20px; font-size: 22px; padding: 16px 20px; border-radius: 20px; border-bottom-left-radius: 8px; max-height: 40%; }
    .right { grid-area: right; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; padding-right: 4px; }
    .screen { display: flex; padding-bottom: 0; overflow: visible; flex: 0 0 auto; }
    #screen-chat { gap: 14px; }
    .me-line { font-size: 18px; }
    .talk { padding: 14px 18px; }
    .mic { width: 76px; height: 76px; }
    .mic svg { width: 32px; height: 32px; }
    .talk .t b { font-size: 18px; }
    #screen-bento { border-top: 1px solid var(--line); padding-top: 14px; }
    .nav { display: none; }
  }
</style>
</head>
<body data-tab="chat">
<div class="app">
  <header class="topbar">
    <div class="mark">さ</div>
    <div><h1>会長のスケジュール係</h1><div class="sub">桜井電装・櫻井会長 専用</div></div>
    <div class="sync"><span class="dot" id="dash-dot"></span><span id="dash-text">所在ダッシュボード</span></div>
  </header>

  <!-- さくら。会話中もここは動かない。最新の一言だけが差し替わる -->
  <div class="portrait" id="portrait">
    <img src="assets/assistant-avatar.png" alt="さくら">
    <span class="live" id="live"><i></i>会話中</span>
    <div class="ai-line" id="ai-line"></div>
  </div>

  <div class="right">
    <section class="screen active" id="screen-chat">
      <div class="today" id="today-tags"></div>
      <div class="me-line" id="me-line"></div>
      <div class="talk">
        <button class="mic" id="mic" aria-label="話す">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <div class="t"><b id="talk-title">タップして話す</b><span id="talk-sub">つながるまで数秒かかります</span></div>
      </div>
      <div class="sys-line" id="sys-line"></div>
    </section>

    <section class="screen" id="screen-bento">
      <div class="section-head"><h2>会長のお弁当</h2><span class="meta">事務の方はこちらを見て注文</span></div>
      <div class="summary" id="summary"></div>
      <div class="section-head"><h2 style="font-size:15px">これから 7 日</h2><span class="meta">予定は所在ダッシュボードから</span></div>
      <div class="week" id="week"></div>
      <p class="foot" id="usage"></p>
    </section>
  </div>

  <nav class="nav" role="tablist">
    <div class="nav-inner">
      <button role="tab" id="tab-chat" aria-selected="true" data-go="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.5-4.5A8 8 0 1 1 21 12z"/></svg>会話</button>
      <button role="tab" id="tab-bento" aria-selected="false" data-go="bento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M3 12h18M9 7V4h6v3"/></svg>お弁当</button>
    </div>
  </nav>
</div>

<script>
/* ------------------------------------------------ タブ（スマホだけ。PC は両方見えている） */
const screens = { chat: 'screen-chat', bento: 'screen-bento' };
function go(key) {
  for (const [k, id] of Object.entries(screens)) {
    document.getElementById(id).classList.toggle('active', k === key);
    document.getElementById('tab-' + k).setAttribute('aria-selected', String(k === key));
  }
  document.body.dataset.tab = key;
}
document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)));

/* ------------------------------------------------ いまの一言（流れない。最新だけ差し替える） */
const aiLine = document.getElementById('ai-line');
const meLine = document.getElementById('me-line');
const sysLine = document.getElementById('sys-line');
const TURN_GAP_MS = 2500;
const current = { me: null, ai: null }; // { text, endMs }
function sys(text, err = false) { sysLine.textContent = text; sysLine.classList.toggle('err', err); }
function appendDelta(role, delta, startMs, endMs) {
  const cur = current[role];
  if (cur && !(startMs - cur.endMs > TURN_GAP_MS)) { cur.text += delta; cur.endMs = Math.max(cur.endMs, endMs); }
  else current[role] = { text: delta, endMs };
  (role === 'me' ? meLine : aiLine).textContent = current[role].text;
}

/* ------------------------------------------------ GPT-Live（WebRTC）。docs/reference/gpt-live-api.md §2 の手順 */
const mic = document.getElementById('mic');
const liveBadge = document.getElementById('live');
const talkTitle = document.getElementById('talk-title');
const talkSub = document.getElementById('talk-sub');
let pc = null, channel = null, stream = null, audioEl = null, sessionId = null, busy = false;

function setTalk(state, title, sub) {
  mic.classList.toggle('on', state === 'on');
  liveBadge.classList.toggle('on', state === 'on');
  mic.disabled = state === 'busy';
  talkTitle.textContent = title; talkSub.textContent = sub;
}
const waitIce = (conn, ms) => new Promise((resolve) => {
  if (conn.iceGatheringState === 'complete') return resolve();
  const t = setTimeout(done, ms);
  function done() { clearTimeout(t); conn.removeEventListener('icegatheringstatechange', on); resolve(); }
  function on() { if (conn.iceGatheringState === 'complete') done(); }
  conn.addEventListener('icegatheringstatechange', on);
});

async function start() {
  setTalk('busy', 'つないでいます…', 'マイクの許可を求められたら「許可」を押してください');
  aiLine.textContent = ''; meLine.textContent = ''; current.me = null; current.ai = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    setTalk('off', 'タップして話す', 'マイクが使えません。ブラウザの設定で許可してください');
    sys('マイクの許可が得られませんでした。', true); return;
  }
  pc = new RTCPeerConnection();
  audioEl = document.createElement('audio'); audioEl.autoplay = true; document.body.appendChild(audioEl);
  pc.addEventListener('track', (e) => { audioEl.srcObject = new MediaStream([e.track]); audioEl.play().catch(() => sys('音声の再生がブロックされました。画面を一度タップしてください。', true)); });
  for (const t of stream.getAudioTracks()) pc.addTrack(t, stream);
  channel = pc.createDataChannel('oai-events'); // offer の前に作る
  channel.addEventListener('message', (e) => onLiveEvent(String(e.data)));
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitIce(pc, 10000);
  const sdp = pc.localDescription?.sdp ?? offer.sdp;
  let res;
  try {
    res = await ssmFetch('/api/voice/sessions', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sdp_offer: sdp }) });
  } catch { res = null; }
  if (!res || !res.ok) {
    const msg = res ? (await res.json().catch(() => ({}))).error || `エラー ${res.status}` : '通信できません';
    teardown(); setTalk('off', 'タップして話す', 'つながりませんでした'); sys(`つながりませんでした: ${msg}`, true); return;
  }
  const { session_id, sdp_answer } = await res.json();
  sessionId = session_id;
  await pc.setRemoteDescription({ type: 'answer', sdp: sdp_answer });
  setTalk('busy', 'もうすぐ話し始めます…', '');
}

function onLiveEvent(raw) {
  let ev; try { ev = JSON.parse(raw); } catch { return; }
  switch (ev.type) {
    case 'session.started':
      setTalk('on', '話しています', 'もう一度押すと終わります'); sys('さくらとつながりました'); break;
    case 'session.input_transcript.delta':
      if (ev.delta) appendDelta('me', ev.delta, ev.start_ms ?? 0, ev.end_ms ?? 0); break;
    case 'session.output_transcript.delta':
      if (ev.delta) appendDelta('ai', ev.delta, ev.start_ms ?? 0, ev.end_ms ?? 0); break;
    case 'session.closed': {
      const r = ev.reason;
      sys(r === 'close_requested' ? '会話を終わりました' : r === 'expired' ? '時間切れで終わりました' : '会話が切れました');
      teardown(); setTalk('off', 'タップして話す', 'もう一度話すときは押してください'); refresh(); break;
    }
    case 'error':
      sys('音声でエラーが起きました（' + (ev.error?.code ?? 'unknown') + '）', true); break;
  }
}

async function stop() {
  setTalk('busy', '終わっています…', '');
  const id = sessionId; sessionId = null;
  if (channel && channel.readyState === 'open') {
    const closed = new Promise((resolve) => { const h = (e) => { try { if (JSON.parse(e.data).type === 'session.closed') resolve(); } catch {} }; channel.addEventListener('message', h); });
    channel.send(JSON.stringify({ type: 'session.close' }));
    await Promise.race([closed, new Promise((r) => setTimeout(r, 15000))]);
  }
  teardown();
  if (id) await ssmFetch(`/api/voice/sessions/${id}/close`, { method: 'POST' }).catch(() => {});
  setTalk('off', 'タップして話す', 'もう一度話すときは押してください');
  refresh();
}

function teardown() {
  for (const t of stream?.getTracks() ?? []) t.stop(); stream = null;
  if (audioEl) { audioEl.srcObject = null; audioEl.remove(); audioEl = null; }
  try { channel?.close(); } catch {} channel = null;
  try { pc?.close(); } catch {} pc = null;
}

mic.addEventListener('click', async () => {
  if (busy) return; busy = true;
  try { if (pc) await stop(); else await start(); } catch (e) { sys('エラー: ' + (e?.message ?? e), true); teardown(); setTalk('off', 'タップして話す', ''); }
  busy = false;
});
window.addEventListener('pagehide', () => { if (sessionId) navigator.sendBeacon?.(`/api/voice/sessions/${sessionId}/close`); });

/* ------------------------------------------------ 状態（予定・お弁当）。数秒おきに読む */
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const parts = (iso) => iso.split('-').map(Number);
const addDays = (iso, n) => { const [y, m, d] = parts(iso); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const dow = (iso) => { const [y, m, d] = parts(iso); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
const wd = (iso) => WD[dow(iso)];
const md = (iso) => `${Number(iso.slice(5, 7))}/${Number(iso.slice(8, 10))}`;
const lunchPill = (l, weekend) => l ? (l.needed ? '<span class="pill yes">いる</span>' : '<span class="pill no">いらない</span>') : weekend ? '<span class="pill off">なし</span>' : '<span class="pill ask">未回答</span>';
const lunchWord = (l) => (l ? (l.needed ? 'いる' : 'いらない') : '未回答');
const hm = (iso) => iso ? new Date(iso).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tokyo' }) : '';

async function refresh() {
  let s; try { const r = await ssmFetch('/api/state', { cache: 'no-store' }); if (!r.ok) return; s = await r.json(); } catch { return; }
  document.getElementById('dash-dot').className = 'dot' + (s.dashboard_ok ? '' : ' bad');
  document.getElementById('dash-text').textContent = s.dashboard_ok ? 'ダッシュボード 接続中' : 'ダッシュボードに届きません';
  const today = s.today, tomorrow = addDays(today, 1);
  const on = (iso) => s.events.filter((e) => e.date <= iso && (e.endDate || e.date) >= iso);
  const t0 = on(today), tl = s.lunch[today];
  document.getElementById('today-tags').innerHTML =
    `<span class="tag num">今日 ${md(today)}（${wd(today)}） ${t0.length ? t0.map((e) => e.title).join('・') : '予定なし'}</span>` +
    `<span class="tag ${tl ? (tl.needed ? 'yes' : '') : 'ask'}">今日のお弁当 ${lunchWord(tl)}</span>` +
    `<span class="tag ${s.lunch[tomorrow] ? (s.lunch[tomorrow].needed ? 'yes' : '') : 'ask'}">明日 ${lunchWord(s.lunch[tomorrow])}</span>`;
  // 会話が始まる前は、さくらの吹き出しに今日の状況を出しておく
  if (!pc && !current.ai) {
    const h = new Date().getHours();
    aiLine.textContent = `${h < 11 ? 'おはようございます' : 'こんにちは'}、会長。${t0.length ? '今日は' + t0.map((e) => e.title).join('と') + 'ですね。' : '今日の予定は入っていません。'}マイクを押して、ご予定やお弁当のことをお聞かせください。`;
  }
  const tile = (iso, name) => { const l = s.lunch[iso]; const ev = on(iso); return `<div class="tile"><div class="lbl num">${name} ${md(iso)}（${wd(iso)}）</div><div class="val">${lunchPill(l, false)}</div><div class="when">${l ? hm(l.answered_at) + ' 会長が回答' : (ev.length ? ev.map((e) => e.title).join('・') : '予定なし')}</div></div>`; };
  document.getElementById('summary').innerHTML = tile(today, '今日') + tile(tomorrow, '明日');
  let rows = '';
  for (let i = 0; i < 7; i++) {
    const iso = addDays(today, i); const w = dow(iso); const weekend = w === 0 || w === 6;
    const ev = on(iso);
    rows += `<div class="day${i === 0 ? ' today' : ''}${w === 0 ? ' sun' : w === 6 ? ' sat' : ''}"><div class="d"><b class="num">${Number(iso.slice(8, 10))}</b><span>${wd(iso)}${i === 0 ? '・今日' : ''}</span></div><div class="p">${ev.length ? ev.map((e) => `<span class="kind ${e.kind}">${e.kind}</span><span>${e.time ? e.time + ' ' : ''}${e.title}</span>`).join('') : (weekend ? '<span class="none">休業日</span>' : '<span class="none">予定なし</span>')}</div><span class="b">${lunchPill(s.lunch[iso], weekend)}</span></div>`;
  }
  document.getElementById('week').innerHTML = rows;
  document.getElementById('usage').textContent = `音声の利用 今日 ${s.voice.minutes_today} 分 / 上限 ${s.voice.daily_limit_min} 分`;
}

// 身元を確かめてから起動する（401/503 のときは案内画面だけを出す）
ssmGate().then((ok) => {
  if (!ok) { mic.disabled = true; return; }
  refresh();
  setInterval(refresh, 5000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
});
</script>
